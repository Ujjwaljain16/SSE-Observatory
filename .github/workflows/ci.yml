name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # The CLI package: build it, run the built bundle, then install the packed tarball into a clean directory.
      - run: npm run build:cli
      - run: npm run doctor:selftest
      - run: npm run cli:check
      # Scenario files against the built-in fixture streams: passing ones pass, failing ones fail, unprovable ones are inconclusive (exit 4).
      - run: npm run doctor:scenarios
      - name: Upload scenario results (JUnit)
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: scenario-results-junit
          path: dist-cli/scenarios-junit.xml
          if-no-files-found: ignore

  audit:
    name: Dependency audit (runtime, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sse-observatory .
      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 sse-observatory
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3000/healthz && exit 0; sleep 1; done
          docker logs app; exit 1

  e2e:
    name: Playwright (dev servers)
    runs-on: ubuntu-latest
    # Blocking. It was informational while the suite flaked on cold runners; it has since passed on every run of the last
    # 14 pull requests (the flaky specs were fixed at the cause), with two retries per test as a safety net.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-other-browsers:
    name: Playwright (Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Informational for now, like the Chromium job: the whole suite passes locally in both, this keeps it that way.
    continue-on-error: true
    env:
      E2E_BROWSERS: firefox,webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test --project=firefox --project=webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-other-browsers
          path: playwright-report/
          retention-days: 7
