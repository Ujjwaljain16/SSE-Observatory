name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build (${{ matrix.os }}${{ matrix.node == 20 && ', Node 20' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
        include:
          # the oldest Node the command line supports, once, on Linux
          - os: ubuntu-latest
            node: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # The CLI package: build it, run the built bundle, then install the packed tarball into a clean directory.
      - run: npm run build:cli
      - run: npm run doctor:selftest
      # What the published command line holds: no machine path, no source map, no source path in its types; it runs from an empty directory.
      - run: npm run doctor:buildcheck
      - run: npm run cli:check
      # Scenario files against the built-in fixture streams: passing ones pass, failing ones fail, unprovable ones are inconclusive (exit 4).
      - run: npm run doctor:scenarios
      # The built command line as a process: exit codes, a clean stdout, no stack traces, and that it always stops (Windows and Linux).
      - run: npm run doctor:contract
      - name: Upload scenario results (JUnit)
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: scenario-results-junit
          path: dist-cli/scenarios-junit.xml
          if-no-files-found: ignore

  audit:
    name: Dependency audit (runtime, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sse-observatory .
      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 sse-observatory
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3000/healthz && exit 0; sleep 1; done
          docker logs app; exit 1

  e2e:
    name: Playwright (dev servers)
    runs-on: ubuntu-latest
    # Blocking. It was informational while the suite flaked on cold runners; it has since passed on every run of the last
    # 14 pull requests (the flaky specs were fixed at the cause), with two retries per test as a safety net.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:cli
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-other-browsers:
    name: Playwright (${{ matrix.part.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Informational for now: Firefox and WebKit run the whole behavioural suite, and two phone-emulation projects (iPhone 14 on WebKit, Pixel 7 on
    # Chromium) run e2e/mobile.spec.ts. Playwright's WebKit is not Safari, and emulation is not a phone.
    # Split in parts: as one job (one worker, two retries per failure) it never finished inside its 30 minutes, so it gave no result at all.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: 'Firefox 1/2', key: firefox-1, install: firefox, args: '--project=firefox --shard=1/2' }
          - { name: 'Firefox 2/2', key: firefox-2, install: firefox, args: '--project=firefox --shard=2/2' }
          - { name: 'WebKit 1/2', key: webkit-1, install: webkit, args: '--project=webkit --shard=1/2' }
          - { name: 'WebKit 2/2', key: webkit-2, install: webkit, args: '--project=webkit --shard=2/2' }
          - { name: 'phone emulation', key: mobile, install: 'webkit chromium', args: '--project=mobile-iphone --project=mobile-pixel' }
    env:
      E2E_BROWSERS: firefox,webkit,mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.part.install }}
      - run: npm run build:cli
      - run: npx playwright test ${{ matrix.part.args }} --retries=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.part.key }}
          path: playwright-report/
          retention-days: 7
